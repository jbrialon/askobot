<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@300&display=swap"
      rel="stylesheet"
    />
    <title>Open AI</title>
    <style>
      * {
        font-family: "Roboto Mono", monospace;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>Open AI</h1>
    <button onclick="generateText()">Send Request</button>
    <script>
      function generateText() {
        const messages = [
          {
            role: "user",
            content:
              "A unity c# class script that creates 20 primitiveType cubes and consistently rotate them along the y axis at very fast speed, do not include any explanations,aways include code with markdown,do not require any prefabs,do not require any references,all references should not be null",
          },
        ];
        fetch("/gpt", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            messages: messages,
          }),
        })
          .then((response) => response.json())
          .then((data) => {
            // Handle the generated text here
            console.log(data);
          })
          .catch((error) => {
            console.error(error);
          });
      }
    </script>
  </body>
</html>
