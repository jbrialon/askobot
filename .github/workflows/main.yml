name: Deploy
on:
  push:
    branches: [main]

jobs:
  ssh-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH update code, build frontend, and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/${{ vars.SSH_USERNAME }}/${{ vars.SSH_FOLDER }}
            git fetch --all
            git pull

            # Backend dependencies
            npm install
            npm run build

            # Frontend build
            cd front
            npm install
            npm run build

            # Restart Node app
            supervisorctl restart ${{ vars.SSH_FOLDER }}
